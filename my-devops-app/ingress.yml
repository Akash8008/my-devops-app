apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: akash-ingress
  namespace: dev

spec:
  ingressClassName: nginx

  rules:
    - host: myapp.local.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-devops-app
                port:
                  number: 80